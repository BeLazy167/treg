provider: tavily
source:
  docs: https://docs.tavily.com/documentation/api-reference
  openapi: https://docs.tavily.com/documentation/api-reference/openapi.json
  curated: '2026-09-21'
pricing_url: https://docs.tavily.com/documentation/api-credits
limits: "Development keys allow 100 requests/minute and production keys 1,000 requests/minute; Crawl is limited to 100 requests/minute on both. A 429 may include Retry-After. Every call requires include_usage: true. Shared Map and Crawl calls also require an explicit limit of 1-20 so the maximum hold is bounded; BYOK retains Tavily's upstream range."

endpoints:
  - id: tavily.web.search
    capability: web.search
    platform: web
    domain: search
    scope: any_account
    method: POST
    path: /search
    name: Search the open web
    summary: Search the web with semantic ranking, optional answers, domain and date filters, images, and page content.
    input:
      bodyType: json
      body:
        query: {type: string, required: true, example: "recent changes to the EU AI Act guidance"}
        search_depth: {type: string, required: false, default: basic, enum: [basic, advanced, fast, ultra-fast], example: basic, note: "Basic, fast and ultra-fast cost 1 credit; advanced costs 2. auto_parameters can raise a basic request to the advanced price."}
        chunks_per_source: {type: integer, required: false, default: 3, min: 1, max: 3}
        max_results: {type: integer, required: false, default: 10, min: 0, max: 20, example: 5}
        topic: {type: string, required: false, default: general, enum: [general, news, finance]}
        time_range: {type: string, required: false, enum: [day, week, month, year, d, w, m, y]}
        start_date: {type: string, required: false, note: "YYYY-MM-DD; must precede end_date."}
        end_date: {type: string, required: false, note: "YYYY-MM-DD; must follow start_date."}
        include_published_date: {type: boolean, required: false, default: false}
        filter_by_published_date: {type: boolean, required: false, default: false}
        include_answer: {type: "boolean|string", required: false, default: false, note: "false, true, basic, or advanced"}
        include_raw_content: {type: "boolean|string", required: false, default: false, note: "false, true, markdown, or text"}
        include_images: {type: boolean, required: false, default: false}
        include_image_descriptions: {type: boolean, required: false, default: false}
        include_favicon: {type: boolean, required: false, default: false}
        include_domains: {type: "array[string]", required: false, maxItems: 300}
        exclude_domains: {type: "array[string]", required: false, maxItems: 150}
        include_domains_mode: {type: string, required: false, enum: [restrict, prefer]}
        country: {type: string, required: false, note: "Country name accepted by Tavily; available for general search."}
        language: {type: string, required: false, default: en}
        filter_by_language: {type: boolean, required: false, default: false}
        auto_parameters: {type: boolean, required: false, default: false}
        exact_match: {type: boolean, required: false, default: false}
        include_usage: {type: boolean, required: true, enum: [true], example: true, note: "Required on every call; platform settlement uses Tavily's reported credit charge."}
        safe_search: {type: boolean, required: false, default: false}
      note: "Results are ranked web pages with title, URL, content, score and optional raw content, publication date, favicon and images. HTTP 432 is the plan cap; 433 is the PAYGO cap."
    platform_request: {body.include_usage: true}
    test_request:
      body: {query: "recent changes to the EU AI Act guidance", search_depth: basic, max_results: 3, include_usage: true}
    verified: '2026-09-21'
    cost:
      type: per_success
      table:
        - {when: {body.auto_parameters: true}, value: 2}
        - {when: {body.search_depth: advanced}, value: 2}
        - {when: {body.search_depth: basic}, value: 1}
        - {when: {body.search_depth: fast}, value: 1}
        - {when: {body.search_depth: ultra-fast}, value: 1}
      fallback: {value: 2, note: "The documented maximum is the two-credit advanced search selected explicitly or by auto_parameters."}
      currency: credit
      unit: call
      reported_charge: {path: usage.credits, unit: credit}
      source: docs
      source_url: https://docs.tavily.com/documentation/api-credits
      checked: '2026-09-21'
      confidence: documented
      note: "Basic, fast and ultra-fast use one credit; advanced and auto-selected advanced search use two. The response's usage.credits settles the exact charge."
    docs_url: https://docs.tavily.com/documentation/api-reference/endpoint/search
    example_response: examples/tavily.web.search.json

  - id: tavily.web.extract
    capability: web.extract
    platform: web
    domain: extract
    scope: any_account
    method: POST
    path: /extract
    name: Extract web pages
    summary: Extract clean content from one to twenty URLs, with optional query-focused chunks and images.
    input:
      bodyType: json
      body:
        urls: {type: "array[string]", required: true, minItems: 1, maxItems: 20, example: ["https://example.com"]}
        query: {type: string, required: false, note: "Rerank extracted chunks for this query."}
        chunks_per_source: {type: integer, required: false, default: 3, min: 1, max: 5}
        extract_depth: {type: string, required: false, default: basic, enum: [basic, advanced], example: basic}
        include_images: {type: boolean, required: false, default: false}
        include_favicon: {type: boolean, required: false, default: false}
        format: {type: string, required: false, default: markdown, enum: [markdown, text]}
        timeout: {type: number, required: false, min: 1, max: 60}
        include_usage: {type: boolean, required: true, enum: [true], example: true, note: "Required on every call; platform settlement uses Tavily's reported grouped credit debit."}
      note: "Failed URLs appear in failed_results and are not charged. Every five successful basic extractions cost one credit; advanced costs two. usage.credits may be zero before the account-level group threshold is crossed."
    platform_request: {body.include_usage: true}
    test_request:
      body: {urls: ["https://example.com"], extract_depth: basic, include_usage: true}
    verified: '2026-09-21'
    cost:
      type: per_success
      table:
        - {when: {body.extract_depth: advanced}, value: 8}
        - {when: {body.extract_depth: basic}, value: 4}
      fallback: {value: 8, note: "Twenty successful advanced URL extractions form four five-page groups at two credits each."}
      currency: credit
      unit: call
      display: {unit: call, maximum: true}
      reported_charge: {path: usage.credits, unit: credit}
      source: docs
      source_url: https://docs.tavily.com/documentation/api-credits
      checked: '2026-09-21'
      confidence: documented
      note: "Reserve uses the maximum for the request's depth and the twenty-URL cap. Shared settlement uses the exact response usage.credits debit, including zero before a grouped threshold is crossed; BYOK is unmetered."
    docs_url: https://docs.tavily.com/documentation/api-reference/endpoint/extract
    example_response: examples/tavily.web.extract.json

  - id: tavily.web.map
    capability: web.map
    platform: web
    domain: map
    scope: any_account
    method: POST
    path: /map
    name: Map a website
    summary: Discover URLs from a website with depth, breadth, path and domain controls.
    input:
      bodyType: json
      body:
        url: {type: string, required: true, example: "https://example.com"}
        instructions: {type: string, required: false, note: "Natural-language discovery instructions; doubles the mapping credit rate."}
        max_depth: {type: integer, required: false, default: 1, min: 1, max: 5}
        max_breadth: {type: integer, required: false, default: 20, min: 1, max: 500}
        limit: {type: integer, required: false, min: 1, example: 10, note: "Shared-key calls require an explicit value of 1-20. Tavily publishes no upstream maximum; BYOK can use its accepted range."}
        select_paths: {type: "array[string]", required: false}
        select_domains: {type: "array[string]", required: false}
        exclude_paths: {type: "array[string]", required: false}
        exclude_domains: {type: "array[string]", required: false}
        allow_external: {type: boolean, required: false, default: true}
        timeout: {type: number, required: false, default: 150, min: 10, max: 150}
        include_usage: {type: boolean, required: true, enum: [true], example: true, note: "Required on every call; platform settlement uses Tavily's reported grouped credit debit."}
      note: "A failed map is free. Regular mapping costs one credit per ten successful pages; instructions cost two."
    platform_request: {body.include_usage: true}
    platform_bounds: {body.limit: {min: 1, max: 20}}
    test_request:
      body: {url: "https://example.com", limit: 10, include_usage: true}
    verified: '2026-09-21'
    cost:
      type: per_success
      value: 4
      currency: credit
      per: 1
      unit: call
      display: {unit: call, maximum: true}
      reported_charge: {path: usage.credits, unit: credit}
      source: docs
      source_url: https://docs.tavily.com/documentation/api-credits
      checked: '2026-09-21'
      confidence: documented
      note: "Four credits is the bounded shared-key ceiling: twenty successful pages in two groups, with instructions at two credits per group. Shared settlement uses response usage.credits, including zero before a grouped threshold; BYOK is unmetered."
    docs_url: https://docs.tavily.com/documentation/api-reference/endpoint/map
    example_response: examples/tavily.web.map.json

  - id: tavily.web.crawl
    capability: web.crawl
    platform: web
    domain: crawl
    scope: any_account
    method: POST
    path: /crawl
    name: Crawl a website
    summary: Map a website and extract clean content from the discovered pages in one request.
    input:
      bodyType: json
      body:
        url: {type: string, required: true, example: "https://example.com"}
        instructions: {type: string, required: false, note: "Natural-language crawl instructions; doubles the mapping portion of the charge."}
        chunks_per_source: {type: integer, required: false, default: 3, min: 1, max: 5}
        max_depth: {type: integer, required: false, default: 1, min: 1, max: 5}
        max_breadth: {type: integer, required: false, default: 20, min: 1, max: 500}
        limit: {type: integer, required: false, min: 1, example: 10, note: "Shared-key calls require an explicit value of 1-20. Tavily publishes no upstream maximum; BYOK can use its accepted range."}
        select_paths: {type: "array[string]", required: false}
        select_domains: {type: "array[string]", required: false}
        exclude_paths: {type: "array[string]", required: false}
        exclude_domains: {type: "array[string]", required: false}
        allow_external: {type: boolean, required: false, default: true}
        include_images: {type: boolean, required: false, default: false}
        extract_depth: {type: string, required: false, default: basic, enum: [basic, advanced], example: basic}
        format: {type: string, required: false, default: markdown, enum: [markdown, text]}
        include_favicon: {type: boolean, required: false, default: false}
        timeout: {type: number, required: false, default: 150, min: 10, max: 150}
        include_usage: {type: boolean, required: true, enum: [true], example: true, note: "Required on every call; platform settlement uses Tavily's reported grouped credit debit."}
      note: "Crawl charge is mapping plus extraction. At the shared twenty-page cap, basic extraction costs at most eight credits with instructions; advanced costs at most twelve."
    platform_request: {body.include_usage: true}
    platform_bounds: {body.limit: {min: 1, max: 20}}
    test_request:
      body: {url: "https://example.com", limit: 10, extract_depth: basic, include_usage: true}
    verified: '2026-09-21'
    cost:
      type: per_success
      table:
        - {when: {body.extract_depth: advanced}, value: 12}
        - {when: {body.extract_depth: basic}, value: 8}
      fallback: {value: 12, note: "Twenty pages with instructions cost four mapping credits; four advanced five-page extraction groups cost eight more."}
      currency: credit
      unit: call
      display: {unit: call, maximum: true}
      reported_charge: {path: usage.credits, unit: credit}
      source: docs
      source_url: https://docs.tavily.com/documentation/api-credits
      checked: '2026-09-21'
      confidence: documented
      note: "The depth table reserves the documented bounded maximum with instructions at twenty pages. Shared settlement uses response usage.credits, including zero before grouped thresholds; BYOK is unmetered."
    docs_url: https://docs.tavily.com/documentation/api-reference/endpoint/crawl
    example_response: examples/tavily.web.crawl.json
